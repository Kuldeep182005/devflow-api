# =============================================================================
# DevFlow CI Pipeline — GitHub Actions
#
# Runs on: Pull Requests, Pushes to default branch
#
# Pipeline stages:
#   1. Compile + Test (Maven Verify with Testcontainers)
#   2. Dependency Security Check (OWASP Dependency-Check)
#   3. Secret Scanning (TruffleHog)
#   4. Docker Image Build + Verification
#   5. Docker Image Security Scan (Trivy)
#   6. Test Artifact Upload (on failure)
#
# SECURITY:
#   - Least-privilege permissions (contents: read)
#   - No secrets exposed to fork PRs
#   - No write-all permissions
#   - No unsafe ${{ }} interpolation in shell commands
#   - Security gates CANNOT be bypassed (no continue-on-error)
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege: only read repository contents
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ================================================================
  # Job 1: Build, Test, and Verify
  # ================================================================
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['21']


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Maven Verify (compile + test + integration tests)
        run: ./mvnw clean verify -B -V
        # -B = batch mode (no interactive)
        # -V = display Maven version

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  # ================================================================
  # Job 2: Dependency Security Check
  # ================================================================
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: OWASP Dependency-Check
        run: |
          ./mvnw org.owasp:dependency-check-maven:10.0.4:aggregate \
            -DfailBuildOnCVSS=9 \
            -DsuppressionsFile=dependency-check-suppressions.xml \
            -Dformats=HTML,JSON \
            -DretireJsAnalyzerEnabled=false \
            -B
        # failBuildOnCVSS=9: Fail on CRITICAL vulnerabilities only
        # This prevents false-positive noise while catching real threats

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14
          if-no-files-found: ignore

  # ================================================================
  # Job 3: Secret Scanning
  # ================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --only-verified --results=verified

  # ================================================================
  # Job 4: Docker Build + Verify
  # ================================================================
  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only build images on trusted branches (not fork PRs)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      API_IMAGE: devflow-api
      EXECUTOR_IMAGE: devflow-sandbox-executor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "api_tag=${API_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "executor_tag=${EXECUTOR_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devflow-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.api_tag }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unset' }}
            VCS_REF=${{ github.sha }}
            VERSION=0.0.1-SNAPSHOT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devflow-sandbox-executor/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.executor_tag }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unset' }}
            VCS_REF=${{ github.sha }}
            VERSION=0.0.1-SNAPSHOT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------- Smoke Tests -------

      - name: Verify API image — non-root user
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.api_tag }}
        run: |
          USER=$(docker inspect --format='{{.Config.User}}' "${IMAGE_TAG}")
          echo "API image user: ${USER}"
          if [ "${USER}" = "root" ] || [ -z "${USER}" ] || [ "${USER}" = "0" ]; then
            echo "::error::API image runs as root — security violation"
            exit 1
          fi

      - name: Verify API image — no Docker socket
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.api_tag }}
        run: |
          # Verify the API image has no docker-java or Docker client dependencies
          docker run --rm --entrypoint="" "${IMAGE_TAG}" \
            sh -c "! ls /var/run/docker.sock 2>/dev/null && echo 'No Docker socket — PASS'"

      - name: Verify API image — startup and liveness
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.api_tag }}
        run: |
          # Start API container with minimal config (no DB required for liveness probe)
          docker run -d --name devflow-api-smoke \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/devflow \
            -e DATABASE_PASSWORD=unused \
            -e JWT_SECRET=ci-smoke-test-secret-key-minimum-32-bytes-long \
            -p 18080:8080 \
            "${IMAGE_TAG}"

          # Wait for JVM startup (may fail to connect to DB, but liveness should work)
          echo "Waiting for API container startup..."
          sleep 15

          # Check if the container is still running (JVM started successfully)
          if docker ps --filter "name=devflow-api-smoke" --format '{{.Status}}' | grep -q "Up"; then
            echo "API container is running — PASS"
          else
            echo "::warning::API container exited (expected without DB) — checking logs"
            docker logs devflow-api-smoke 2>&1 | tail -30
          fi

          docker rm -f devflow-api-smoke || true

      - name: Verify Executor image — non-root user
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.executor_tag }}
        run: |
          USER=$(docker inspect --format='{{.Config.User}}' "${IMAGE_TAG}")
          echo "Executor image user: ${USER}"
          if [ "${USER}" = "root" ] || [ -z "${USER}" ] || [ "${USER}" = "0" ]; then
            echo "::error::Executor image runs as root — security violation"
            exit 1
          fi

      - name: Verify Executor image — startup and health
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.executor_tag }}
        run: |
          docker run -d --name devflow-executor-smoke \
            -e SANDBOX_EXECUTOR_TOKEN=ci-smoke-token \
            -p 18089:8089 \
            "${IMAGE_TAG}"

          echo "Waiting for Executor container startup..."
          sleep 5

          # Query health endpoint with auth token
          curl -fsS -H "X-Sandbox-Token: ci-smoke-token" http://localhost:18089/api/v1/sandbox/health | grep -q "UP" && echo "Executor health check — PASS"

          docker rm -f devflow-executor-smoke || true

      # ------- Image Security Scan -------

      - name: Trivy scan — API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.api_tag }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan — Executor image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.executor_tag }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ================================================================
  # Job 6: Frontend Verification (Lint, Test, Build)
  # ================================================================
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint checks (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Unit & Component tests (Vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Production bundle build (TypeScript + Vite)
        working-directory: frontend
        run: npm run build
